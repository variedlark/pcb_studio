[workspace]
members = [
  "crates/foundation-core",
  "crates/domain-core",
  "crates/engine-geometry",
  "crates/engine-graph",
  "crates/app-core",
  "crates/storage-sqlite",
  "crates/ipc-contracts",
  "apps/desktop-shell/src-tauri",
  "crates/engine-routing",
  "crates/engine-drc",
  "crates/engine-simulation",
  "crates/adapters-io",
  "crates/engine-logic",
  "crates/engine-physics",
  "crates/component-database",
  "crates/engine-optimizer",
  "crates/adapters-cloud",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["Local Engineering Studio Contributors"]

[workspace.dependencies]
criterion = "0.5"
indexmap = { version = "2.12", features = ["serde"] }
rayon = "1.11"
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"
unused_results = "warn"
elided_lifetimes_in_paths = "warn"
invalid_doc_attributes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
module_name_repetitions = { level = "allow", priority = -1 }
similar_names = { level = "allow", priority = -1 }
missing_panics_doc = { level = "allow", priority = -1 }
missing_errors_doc = { level = "allow", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3
